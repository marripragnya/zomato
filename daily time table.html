    <title>daily time table</title>
</head>
<body>

            <td rowspan="7">Python</td>
        </tr>
        <tr>
            <th>Tuesday</th>
            
        </tr>
        <tr>
            
            <th>Wednesday</th>
        </tr>
        <tr>
            
            <th>Thursday</th>
        </tr>
        <tr>

            <th>Friday</th>
        </tr>
        <tr>

            <th>Saturday</th>
        </tr>
    </table>
</body>
</html>
