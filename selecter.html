<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selecter</title>
    <style>
        .bg1{
            background-color: aquamarine;
        }
        .bg2{
            background-color: darkkhaki;

        }
        .bg3{
            background-color:yellowgreen ;

        }
        .f1{
            color:purple ;

        }
        .f2{
            color:pink ;

        }
    
    </style>

</head>
<body>
    <h1 class="bg2 f1">paint</h1>
    <h1 class="bg3 f2">CSS</h1>
    <p class="bg1 f1">sheshi</p>
    <p class="bg2 f1">Hari</p>
    <p class="bg3 f1">Shiva</p>
</body>
</html>
